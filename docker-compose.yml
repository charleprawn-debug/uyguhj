version: '3.8'

services:
  # PostgreSQL Database (if running locally instead of Supabase)
  postgres:
    image: postgres:15-alpine
    container_name: proxy-platform-db
    environment:
      POSTGRES_DB: proxy_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and job queues
  redis:
    image: redis:7-alpine
    container_name: proxy-platform-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proxy-platform-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres123}@postgres:5432/proxy_platform
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      FRONTEND_URL: http://localhost:3001
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/logs:/app/logs
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Admin Dashboard (Node.js / Next.js)
  # admin:
  #   build:
  #     context: ./admin
  #     dockerfile: Dockerfile
  #   container_name: proxy-platform-admin
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
  #     NEXT_PUBLIC_APP_NAME: Proxy Platform Admin
  #   ports:
  #     - "${ADMIN_PORT:-3002}:3000"
  #   depends_on:
  #     - backend
  #   networks:
  #     - proxy-network

  # Proxy Health Check Worker (optional, separate container)
  # worker:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile.worker
  #   container_name: proxy-platform-worker
  #   environment:
  #     NODE_ENV: development
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #     SUPABASE_URL: ${SUPABASE_URL}
  #     SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
  #   depends_on:
  #     - redis
  #     - backend
  #   networks:
  #     - proxy-network

volumes:
  postgres_data:
  redis_data:

networks:
  proxy-network:
    driver: bridge
