<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1180px;margin:auto;padding:28px 18px}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand h1{margin:0;font-size:28px}.muted{color:#718096}.panel,.stat{background:#fff;border:1px solid #e7edf5;border-radius:18px;box-shadow:0 8px 28px #263b5b0b}.panel{padding:22px;margin-bottom:20px}.login{max-width:420px;margin:10vh auto}.input{width:100%;padding:13px 14px;border:1px solid #d8e0ec;border-radius:12px;margin:7px 0 13px;font-size:15px}.btn{border:0;border-radius:12px;padding:12px 18px;background:#315efb;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#edf2ff;color:#315efb}.btn.danger{background:#fff0f0;color:#c24141}.error{color:#c24141;margin:10px 0}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.stat{padding:18px}.stat b{display:block;font-size:28px;margin-top:8px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{border:0;background:#edf2f7;padding:10px 16px;border-radius:10px;cursor:pointer}.tabs button.active{background:#315efb;color:#fff}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:right;padding:13px 10px;border-bottom:1px solid #edf1f6;white-space:nowrap}th{color:#66758b;font-size:13px}.pill{padding:5px 9px;border-radius:99px;background:#e8f7ef;color:#16794a;font-size:12px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form-grid label{font-size:13px;color:#66758b}.form-grid input,.form-grid select{width:100%;padding:10px;border:1px solid #d8e0ec;border-radius:10px;margin-top:5px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.brand{align-items:flex-start;gap:12px;flex-direction:column}}
</style></head><body><main id="login" class="shell login panel"><h1>تسجيل الدخول</h1><p class="muted">لوحة إدارة المشروع</p><form id="loginForm"><label>البريد الإلكتروني<input id="email" class="input" type="email" required autocomplete="username"></label><label>كلمة المرور<input id="password" class="input" type="password" required autocomplete="current-password"></label><button class="btn" type="submit">دخول آمن</button><p id="loginError" class="error"></p></form></main>
<main id="app" class="shell hidden"><header class="brand"><div><h1>لوحة التحكم</h1><p class="muted">نظرة شاملة على الحسابات والخطط والنشاط</p></div><button id="logout" class="btn secondary">تسجيل الخروج</button></header><section class="grid" id="stats"></section><section class="panel"><nav class="tabs"><button class="active" data-tab="users">المستخدمون</button><button data-tab="plans">الخطط</button></nav><div id="users" class="tab"></div><div id="plans" class="tab hidden"></div></section></main>
<script>
const $=s=>document.querySelector(s), tokenKey='admin_access_token';let token=localStorage.getItem(tokenKey);const api=(path,opt={})=>fetch('/api/v1/admin'+path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(opt.headers||{})}}).then(async r=>{const j=await r.json();if(!r.ok)throw Error(j.error?.message||'تعذر تنفيذ الطلب');return j});
function showApp(){ $('#login').classList.add('hidden');$('#app').classList.remove('hidden');load() }function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function load(){try{const [o,u,p]=await Promise.all([api('/overview'),api('/users'),api('/plans')]);const c=o.data.counts;$('#stats').innerHTML=[['المستخدمون',c.users],['الخطط',c.proxy_products],['الاشتراكات',c.subscriptions],['النشطة الآن',o.data.activeSubscriptions],['الطلبات',c.orders]].map(x=>`<div class="stat"><span class="muted">${x[0]}</span><b>${x[1]??0}</b></div>`).join('');renderUsers(u.data);renderPlans(p.data)}catch(e){localStorage.removeItem(tokenKey);location.reload()}}
function renderUsers(rows){$('#users').innerHTML=`<div class="toolbar"><h2>المستخدمون</h2><span class="muted">${rows.length} حساب</span></div><div class="table-wrap"><table><thead><tr><th>البريد</th><th>الاسم</th><th>الصلاحية</th><th>الحالة</th><th>التسجيل</th><th>آخر دخول</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.email)}</td><td>${esc(r.full_name||'—')}</td><td>${esc(r.role)}</td><td><span class="pill">${esc(r.status)}</span></td><td>${new Date(r.created_at).toLocaleDateString('ar')}</td><td>${r.last_login_at?new Date(r.last_login_at).toLocaleString('ar'):'—'}</td></tr>`).join('')}</tbody></table></div>`}
function renderPlans(rows){$('#plans').innerHTML=`<div class="toolbar"><h2>الخطط</h2><button class="btn" id="newPlan">إضافة خطة</button></div><div id="planForm"></div><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>البروتوكول</th><th>الدولة</th><th>شهري</th><th>المخزون</th><th>الحالة</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.protocol)}</td><td>${esc(r.country_name||'—')}</td><td>${esc(r.price_monthly||0)}</td><td>${esc(r.stock_available||0)}</td><td><span class="pill">${r.is_active?'مفعلة':'متوقفة'}</span></td></tr>`).join('')}</tbody></table></div>`;$('#newPlan').onclick=()=>{$('#planForm').innerHTML=`<form class="panel" id="createPlan"><div class="form-grid"><label>الاسم<input name="name" required></label><label>البروتوكول<select name="protocol"><option>socks5</option><option>http</option><option>https</option></select></label><label>الدولة<input name="countryName"></label><label>رمز الدولة<input name="countryCode" maxlength="2"></label><label>السعر الشهري<input name="priceMonthly" type="number" min="0" step="0.01" value="0"></label><label>المخزون<input name="stockAvailable" type="number" min="0" value="0"></label></div><br><button class="btn">حفظ الخطة</button> <button type="button" class="btn secondary" id="cancelPlan">إلغاء</button></form>`;$('#cancelPlan').onclick=()=>$('#planForm').innerHTML='';$('#createPlan').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{await api('/plans',{method:'POST',body:JSON.stringify(data)});load()}catch(err){alert(err.message)}}}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#password').value})});const j=await r.json();if(!r.ok)throw Error(j.error?.message||'بيانات الدخول غير صحيحة');token=j.data.accessToken;localStorage.setItem(tokenKey,token);showApp()}catch(err){$('#loginError').textContent=err.message}};$('#logout').onclick=()=>{localStorage.removeItem(tokenKey);location.reload()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));$('#'+b.dataset.tab).classList.remove('hidden')});if(token)showApp();
</script></body></html>
